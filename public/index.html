<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Таймеры и Привычки — Since0Bot</title>
    <meta name="description" content="Telegram Mini App для отслеживания привычек и обратного отсчёта. Разработчик: @mynus_x">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div>
            <h1 class="app-title">Таймеры</h1>
            <p class="user-greeting" id="userGreeting">Привет!</p>
        </div>
        <button class="icon-button" id="settingsBtn" aria-label="Settings">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
    </header>

    <main class="app-main">
        <!-- Countdown Tab -->
        <section id="countdownTab" class="tab-panel active">
            <div id="countdownList" class="card-list">
                <!-- Countdowns will be injected here -->
            </div>
            <div id="countdownEmpty" class="empty-state hidden">
                <div class="empty-icon">⏳</div>
                <p>Нет активных таймеров</p>
                <span class="empty-subtext">Нажмите + чтобы создать</span>
            </div>
        </section>

        <!-- Habits Tab -->
        <section id="habitsTab" class="tab-panel">
            <div id="habitsList" class="card-list">
                <!-- Habits will be injected here -->
            </div>
            <div id="habitsEmpty" class="empty-state hidden">
                <div class="empty-icon">📋</div>
                <p>Нет привычек</p>
                <span class="empty-subtext">Нажмите + чтобы добавить</span>
            </div>
        </section>
        
        <!-- Habit Detail View -->
        <section id="habitDetailView" class="detail-view hidden">
            <button class="back-btn" id="backToHabitsBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                Назад
            </button>
            <div class="detail-header">
                <h2 id="detailHabitTitle">Привычка</h2>
                <button class="icon-button danger" id="deleteHabitBtn" aria-label="Delete Habit">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </div>
            
            <div class="calendar-card">
                <div class="calendar-scroll-container">
                    <div id="habitCalendar" class="github-calendar">
                        <!-- Calendar injected here -->
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn primary" id="markTodayBtn">Отметить сегодня ✅</button>
                <button class="btn secondary hidden" id="markYesterdayBtn">Отметить вчера ✅</button>
            </div>
        </section>

        <footer class="app-footer">
            <a href="https://t.me/mynus_x" target="_blank">Разработчик: @mynus_x</a>
        </footer>
    </main>

    <!-- Floating Action Button -->
    <button id="fab" class="fab">+</button>

    <!-- TabBar (Dock) -->
    <nav class="tab-bar">
        <button class="tab-item active" data-tab="countdown">
            <div class="tab-icon">⏳</div>
            <span>Таймеры</span>
        </button>
        <button class="tab-item" data-tab="habits">
            <div class="tab-icon">📋</div>
            <span>Привычки</span>
        </button>
    </nav>

    <!-- Modals -->
    <div id="modalOverlay" class="modal-overlay hidden"></div>
    
    <!-- Create Countdown Modal -->
    <div id="createCountdownModal" class="modal sheet">
        <div class="modal-drag-handle"></div>
        <div class="modal-header">
            <h3>Новый таймер</h3>
            <button class="modal-close" data-modal="createCountdownModal">Отмена</button>
        </div>
        <form id="createCountdownForm" class="modal-form">
            <div class="form-group">
                <label>Название события</label>
                <input type="text" id="cdTitle" required placeholder="Например: Отпуск">
            </div>
            <div class="form-group">
                <label>Дата</label>
                <input type="date" id="cdDate" required>
            </div>
            <div class="form-group">
                <label>Повторять (раз в N дней)</label>
                <input type="number" id="cdFreq" min="0" placeholder="0 - не повторять" value="0">
            </div>
            <div class="form-group">
                <label>Час уведомления (0-23)</label>
                <select id="cdNotifyHour">
                    <option value="0">00:00</option>
                    <option value="1">01:00</option>
                    <option value="2">02:00</option>
                    <option value="3">03:00</option>
                    <option value="4">04:00</option>
                    <option value="5">05:00</option>
                    <option value="6">06:00</option>
                    <option value="7">07:00</option>
                    <option value="8">08:00</option>
                    <option value="9" selected>09:00</option>
                    <option value="10">10:00</option>
                    <option value="11">11:00</option>
                    <option value="12">12:00</option>
                    <option value="13">13:00</option>
                    <option value="14">14:00</option>
                    <option value="15">15:00</option>
                    <option value="16">16:00</option>
                    <option value="17">17:00</option>
                    <option value="18">18:00</option>
                    <option value="19">19:00</option>
                    <option value="20">20:00</option>
                    <option value="21">21:00</option>
                    <option value="22">22:00</option>
                    <option value="23">23:00</option>
                </select>
            </div>
            <button type="submit" class="btn primary full-width mt-4">Создать</button>
        </form>
    </div>

    <!-- Create Habit Modal -->
    <div id="createHabitModal" class="modal sheet">
        <div class="modal-drag-handle"></div>
        <div class="modal-header">
            <h3>Новая привычка</h3>
            <button class="modal-close" data-modal="createHabitModal">Отмена</button>
        </div>
        <form id="createHabitForm" class="modal-form">
            <div class="form-group">
                <label>Название привычки</label>
                <input type="text" id="hbTitle" required placeholder="Например: Чтение 30 мин">
            </div>
            <button type="submit" class="btn primary full-width mt-4">Создать</button>
        </form>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal sheet">
        <div class="modal-drag-handle"></div>
        <div class="modal-header">
            <h3>Настройки</h3>
            <button class="modal-close" data-modal="settingsModal">Готово</button>
        </div>
        <div class="modal-form">
            <div class="form-group">
                <label>Часовой пояс</label>
                <select id="timezoneSelect">
                    <option value="UTC">UTC (Coordinated Universal Time)</option>
                    <option value="Europe/Moscow">Europe/Moscow (UTC+3)</option>
                    <option value="Asia/Almaty">Asia/Almaty (UTC+5)</option>
                    <!-- More options added in JS -->
                </select>
            </div>
            <div class="premium-banner">
                <span class="premium-star">⭐</span>
                <div>
                    <h4>Premium статус</h4>
                    <p id="premiumStatusText">Бесплатный аккаунт. Лимиты: 3 таймера, 1 привычка.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
